name: cipherly
description: Cipherly - peer-to-peer, end-to-end encrypted chat with email code sign-in.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  provider: ^6.1.2
  supabase_flutter: ^2.8.0
  flutter_webrtc: ^1.6.3
  cryptography: ^2.7.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
